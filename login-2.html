<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Huancayo - Login</title>

    <!-- FAVICON Y/O LOGOTIPO DE PAGINA -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />

    <!-- LIBRERIA DE FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <!-- FRAMEWORK DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

    <!-- LIBRERIA DE ICONOS -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>

    <!-- GOOGLE RECAPTCHA API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="css/login-2.css" />
</head>
<body>

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <article class="row w-100">
            
            
            <section class="col-xs-12 col-sm-6 col-md-6">
                <figure class="login__figure">
                    <img src="img/Captura de pantalla 2026-10-27 173049.png" alt="Caja Huancayo Imagen" class="login__img" />
                </figure>
            </section>

            <section class="col-xs-12 col-sm-6 col-md-6 d-flex align-items-center justify-content-center p-4">
                <form action="" method="POST" class="login__form">
                    <header class="login__header">
                        <img src="img/caja huancayo 2.svg" alt="Logo Caja Huancayo" class="login__logo" />
                        <h1 class="login__title">Bienvenido Colaborador</h1>
                        <p class="login__subtitle">Ingrese sus credenciales</p>
                    </header>
                    <fieldset class="login__fieldset">
                        <section class="login__grupo">
                            <input type="text" id="usuario" name="usuario" class="login__input" placeholder="Usuario" required />
                            <label for="usuario" class="login__icono">
                                <i class="fa-regular fa-user"></i>
                            </label>
                        </section>
                        <section class="login__grupo">
                            <input type="password" id="password" name="password" class="login__input" placeholder="Contraseña" required />
                            <label for="password" class="login__icono" id="boton-ver-password" style="cursor: pointer;">
                                <i class="fa-regular fa-eye-slash" id="icono-ojo"></i>
                            </label>
                        </section>
                        <section class="login__opciones">
                            <label class="login__check">
                                <input type="checkbox" class="login__checkbox" />
                                <span class="login__switch"></span>
                                <span>Recordar usuario</span>
                            </label>
                            <a href="#" class="login__link">¿Olvidó sus credenciales?</a>
                        </section>
                        <section class="login__captcha">
                            <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
                        </section>
                        <button type="submit" class="login__btn">Ingresar</button>
                    </fieldset>
                </form>
            </section>

        </article>
    </main>

</body>
</html>
